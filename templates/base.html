<!DOCTYPE html>
<html lang="en" data-palette="ice" data-mode="light" data-glass-preset="rich">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="meta-theme-color" content="#cfe3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Resonance — Feel Every Frequency. Infinite-Premium Liquid Crystal Personal Music Player.">
  <title>{% block title %}Resonance — Feel Every Frequency{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="apple-touch-icon" href="/static/images/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Flash-Free Pre-Paint Appearance Bootstrapper (Palette + Mode + Glass Intensity) -->
  <script>
    (function() {
      try {
        var root = document.documentElement;
        var palette = localStorage.getItem('resonance_palette') || 'ice';
        var modePref = localStorage.getItem('resonance_mode') || 'light';
        var resolvedMode = modePref;
        if (modePref === 'system') {
          resolvedMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-palette', palette);
        root.setAttribute('data-mode', resolvedMode);
        root.setAttribute('data-mode-pref', modePref);

        var preset = localStorage.getItem('resonance_glass_preset') || 'rich';
        root.setAttribute('data-glass-preset', preset);

        var customBlur = localStorage.getItem('resonance_glass_blur');
        var customOpacity = localStorage.getItem('resonance_glass_opacity');
        if (customBlur !== null) root.style.setProperty('--glass-blur-px', customBlur + 'px');
        if (customOpacity !== null) root.style.setProperty('--glass-opacity', customOpacity);

        var reducedEffects = localStorage.getItem('resonance_reduced_effects') === 'true';
        root.setAttribute('data-reduced-effects', reducedEffects ? 'true' : 'false');

        var motion = localStorage.getItem('resonance_motion') || 'full';
        root.setAttribute('data-motion', motion);

        var themeColorsLight = {
          ice: '#cfe3ff',
          rose: '#ffe1ea',
          mint: '#d9f7ec',
          peach: '#ffe6d2',
          lavender: '#e6dcff',
          artwork: '#eef2ff'
        };
        var themeColorsDark = {
          ice: '#0b1230',
          rose: '#210b16',
          mint: '#071f1a',
          peach: '#241109',
          lavender: '#140d2e',
          artwork: '#090d1e'
        };
        var meta = document.getElementById('meta-theme-color');
        if (meta) {
          var map = resolvedMode === 'dark' ? themeColorsDark : themeColorsLight;
          meta.setAttribute('content', map[palette] || (resolvedMode === 'dark' ? '#0b1230' : '#cfe3ff'));
        }
      } catch (_e) {}
    })();
  </script>

  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/palettes.css">
  <link rel="stylesheet" href="/static/css/glass.css">
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/mobile.css">
  {% block head %}{% endblock %}
</head>
